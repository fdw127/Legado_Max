name: 手动同步上游（冲突时以上游为准，自动解决）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游仓库
        run: |
          git remote add upstream https://github.com/Suml-1/Legado_Max.git
          git fetch upstream main

      - name: 合并上游（冲突时强制使用上游版本）
        run: |
          # 尝试合并，如果失败则自动解决冲突
          if ! git merge upstream/main --strategy-option theirs --no-edit; then
            echo "合并发生冲突，开始自动解决..."
            # 列出所有冲突文件
            git diff --name-only --diff-filter=U | while read file; do
              # 检查上游是否存在该文件
              if git ls-tree upstream/main -- "$file" &>/dev/null; then
                # 上游有该文件 → 使用上游版本（恢复或覆盖）
                git checkout --theirs -- "$file"
                git add "$file"
              else
                # 上游没有该文件 → 删除（接受上游的删除）
                git rm --cached "$file" 2>/dev/null || true
              fi
            done
            # 提交合并（使用默认的合并信息）
            git commit --no-edit
            echo "冲突已解决，合并完成。"
          else
            echo "合并成功，无冲突。"
          fi

      - name: 推送到远程仓库
        run: |
          git push origin HEAD
