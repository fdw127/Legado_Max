name: 手动同步上游（冲突时以上游为准）

on:
  workflow_dispatch:   # 仅手动触发

permissions:
  contents: write          # 明确授予推送权限

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整历史以进行合并
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Git 用户信息
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游仓库
        run: |
          git remote add upstream https://github.com/EdisonYo/Legado_Max.git
          git fetch upstream main

      - name: 合并上游分支（冲突时强制使用上游版本）
        run: |
          # 这里假设您要同步到当前分支（通常是 main）
          # 如果您的默认分支不是 main，请将下面的 main 改为您的分支名
          git merge upstream/main --strategy-option theirs --no-edit

      - name: 推送到远程仓库
        run: |
          git push origin HEAD
