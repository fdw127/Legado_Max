name: 手动同步上游（冲突时以上游为准）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游仓库
        run: |
          git remote add upstream https://github.com/Suml-1/Legado_Max.git
          git fetch upstream main

      - name: 合并上游分支（冲突时自动采用上游版本）
        run: |
          # 尝试合并，但不自动提交
          if git merge upstream/main --no-commit --no-ff; then
            # 无冲突，直接提交
            git commit --no-edit
          else
            # 有冲突，自动采用 upstream 版本覆盖所有冲突文件
            echo "检测到冲突，正在使用上游版本覆盖冲突文件..."
            # 获取所有未合并（冲突）的文件
            conflicts=$(git diff --name-only --diff-filter=U)
            for file in $conflicts; do
              echo "解决冲突文件: $file (采用 upstream 版本)"
              git checkout --theirs -- "$file"
              git add "$file"
            done
            # 提交合并
            git commit --no-edit -m "合并上游分支并自动解决冲突（采用上游版本）"
          fi

      - name: 推送到远程仓库
        run: |
          git push origin HEAD
