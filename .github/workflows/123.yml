name: 手动同步上游（保留本地工作流文件）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游仓库
        run: |
          git remote add upstream https://github.com/Suml-1/Legado_Max.git
          git fetch upstream main

      - name: 合并上游（保留 .github/workflows/ 目录）
        run: |
          # 尝试合并，但不自动提交（以便在提交前调整文件）
          if ! git merge upstream/main --strategy-option theirs --no-commit --no-ff; then
            echo "合并发生冲突，开始自动解决..."
            # 处理冲突文件
            git diff --name-only --diff-filter=U | while read file; do
              # 如果文件在 .github/workflows/ 下，使用本地版本
              if [[ "$file" == .github/workflows/* ]]; then
                echo "保留本地版本: $file"
                git checkout --ours -- "$file"
                git add "$file"
              else
                # 其他文件：上游存在则使用上游，否则删除（接受上游删除）
                if git ls-tree upstream/main -- "$file" &>/dev/null; then
                  git checkout --theirs -- "$file"
                  git add "$file"
                else
                  git rm --cached "$file" 2>/dev/null || true
                fi
              fi
            done
          else
            echo "合并无冲突，但强制保留本地 .github/workflows/ 文件"
          fi

          # 无论是否有冲突，强制恢复本地 .github/workflows/ 目录
          # 防止上游修改了这些文件（即使无冲突）
          if [ -d ".github/workflows" ]; then
            git checkout HEAD -- .github/workflows/ 2>/dev/null || true
            git add .github/workflows/ 2>/dev/null || true
          fi

          # 提交合并（如果尚未提交）
          git commit --no-edit || echo "没有待提交的更改"

      - name: 推送到远程仓库
        run: |
          git push origin HEAD
